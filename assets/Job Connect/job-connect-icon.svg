<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="jcBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="jcAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="jcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.35" />
    </filter>
    <filter id="jcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#jcBgGrad)" filter="url(#jcGlow)" />
  
  <!-- Subtle inner shine -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="3" />

  <!-- Center White Circle Badge -->
  <circle cx="256" cy="256" r="148" fill="#ffffff" filter="url(#jcShadow)" />

  <!-- Briefcase & Connecting Tech Node Icon -->
  <g transform="translate(256, 256)">
    <!-- Briefcase handle -->
    <path d="M-44,-42 C-44,-64 44,-64 44,-42" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round" />
    
    <!-- Briefcase body -->
    <rect x="-84" y="-36" width="168" height="116" rx="20" fill="url(#jcAccentGrad)" />
    
    <!-- Briefcase flap highlight -->
    <path d="M-84,-8 L-30,22 C-10,32 10,32 30,22 L84,-8 L84,-36 L-84,-36 Z" fill="rgba(255,255,255,0.25)" />
    
    <!-- Metallic lock / badge -->
    <rect x="-18" y="14" width="36" height="24" rx="6" fill="#ffffff" />
    <circle cx="0" cy="24" r="4" fill="#0284c7" />

    <!-- Pulse nodes indicating tech connection -->
    <circle cx="-52" cy="46" r="6" fill="#ffffff" opacity="0.9" />
    <circle cx="52" cy="46" r="6" fill="#ffffff" opacity="0.9" />
    <line x1="-52" y1="46" x2="-20" y2="26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="52" y1="46" x2="20" y2="26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
