<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b50f6" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#softGlow)" />
  
  <!-- Subtle inner shine -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3" />

  <!-- Center White Circle Badge -->
  <circle cx="256" cy="256" r="148" fill="#ffffff" filter="url(#badgeShadow)" />

  <!-- Graduation Cap Icon matching the app screenshot -->
  <g transform="translate(256, 256) scale(0.95)">
    <!-- Main diamond mortarboard cap top -->
    <polygon points="0,-68 108,-18 0,32 -108,-18" fill="url(#capGrad)" />
    
    <!-- Skull cap body below -->
    <path d="M-68,6 L-68,44 C-68,76 68,76 68,44 L68,6 C48,22 -48,22 -68,6 Z" fill="#3730a3" />
    
    <!-- Cap outline & hollow inner styling matching the app's line-style mortarboard -->
    <polygon points="0,-52 82,-18 0,16 -82,-18" fill="#ffffff" />
    <polygon points="0,-36 56,-18 0,0 -56,-18" fill="url(#capGrad)" />
    
    <!-- Tassel and cord -->
    <path d="M86,-10 C96,-4 104,14 104,36" fill="none" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" />
    <rect x="98" y="34" width="12" height="24" rx="4" fill="#4338ca" />
    <circle cx="0" cy="-18" r="6" fill="#312e81" />
  </g>
</svg>
